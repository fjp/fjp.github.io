{% if site.comments.disqus.shortname %}
  <!--
    Overrides the theme's Disqus include. Disqus loads only when a visitor clicks the button
    above the comment thread, which says that Disqus sets cookies and shows ads. The click is the
    consent for Disqus; the consent message isn't asked.
  -->
  <script>
    (function () {
      var thread = document.getElementById("disqus_thread");
      if (!thread) return;
      var button = document.createElement("button");
      button.type = "button";
      button.className = "btn btn--primary";
      button.textContent = "Show comments";
      var note = document.createElement("p");
      note.className = "small";
      note.innerHTML = 'Comments are hosted by Disqus. Clicking loads Disqus, which sets cookies and shows ads. See the <a href="{{ '/privacy/' | relative_url }}">privacy policy</a>.';
      thread.parentNode.insertBefore(button, thread);
      thread.parentNode.insertBefore(note, thread);
      button.addEventListener("click", function () {
        button.remove();
        note.remove();
        window.disqus_config = function () {
          this.page.url = "{{ page.url | absolute_url }}";
          this.page.identifier = "{{ page.id }}";
        };
        var script = document.createElement("script");
        script.src = "https://{{ site.comments.disqus.shortname }}.disqus.com/embed.js";
        script.setAttribute("data-timestamp", +new Date());
        (document.head || document.body).appendChild(script);
      });
    })();
  </script>
<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
{% endif %}
