<!--
  Consent comes from the European regulations message in AdSense (Privacy & messaging),
  Google's certified consent tool. The AdSense script below shows it to visitors from the
  EEA, UK and Switzerland and answers through the IAB TCF API (__tcfapi).
  Scripts that store data on the device are queued with
    (window.afterConsent = window.afterConsent || []).push({ google: true, run: function () { ... } })
  and run once visitors allow storage on their device (TCF purpose 1), for Google (vendor 755)
  if google is true, or right away when the message doesn't apply to them.
  With an ad blocker the message never loads, and queued scripts never run.
-->
<script>
  (function () {
    var queue = window.afterConsent = window.afterConsent || [];
    var consent = null;
    function runAllowed() {
      for (var i = 0; i < queue.length; i++) {
        var item = queue[i];
        if (!item.done && (item.google ? consent.google : consent.storage)) {
          item.done = true;
          item.run();
        }
      }
    }
    queue.push = function (item) {
      Array.prototype.push.call(queue, item);
      if (consent) runAllowed();
      return queue.length;
    };
    function onConsent(tcData, success) {
      if (!success || !tcData) return;
      if (tcData.gdprApplies === false) {
        consent = { storage: true, google: true };
      } else if (tcData.eventStatus === "tcloaded" || tcData.eventStatus === "useractioncomplete") {
        var storage = !!tcData.purpose.consents[1];
        consent = { storage: storage, google: storage && !!tcData.vendor.consents[755] };
      } else {
        return;
      }
      runAllowed();
    }
    (function waitForConsentTool(tries) {
      if (typeof window.__tcfapi === "function") window.__tcfapi("addEventListener", 2, onConsent);
      else if (tries > 0) setTimeout(function () { waitForConsentTool(tries - 1); }, 250);
    })(120);
  })();
</script>
