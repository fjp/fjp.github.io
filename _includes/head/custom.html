<!--
  Consent comes from the European regulations message in AdSense (Privacy & messaging),
  Google's certified consent tool. The AdSense script below shows it to visitors from the
  EEA, UK and Switzerland. Scripts that need consent are queued with
    (window.afterConsent = window.afterConsent || []).push({ analytics: true, run: function (values) { ... } })
  for Google Analytics, or
    (window.afterConsent = window.afterConsent || []).push({ vendor: 907, run: function () { ... } })
  for a vendor of the IAB Global Vendor List (here AWIN AG). The queue follows the message's answer
  through the Privacy & messaging JavaScript API (googlefc), see
  https://developers.google.com/funding-choices/fc-api-docs
  - Analytics runs when the Analytics choice (analytics_storage) allows it. If that isn't set up in
    AdSense, storage consent (TCF purpose 1) for Google (vendor 755) decides.
  - A vendor runs when storage (purpose 1) and that vendor were allowed in the message.
  - Outside Europe, where the message doesn't apply, everything runs.
  - When visitors withdraw consent, the Analytics cookies are deleted and the page reloads, so
    scripts that already ran are gone. With an ad blocker the consent tool never loads, and
    nothing in the queue runs.
-->
<script>
  (function () {
    var queue = window.afterConsent = window.afterConsent || [];
    var answer = null;
    window.googlefc = window.googlefc || {};
    window.googlefc.callbackQueue = window.googlefc.callbackQueue || [];

    // Values of googlefc.ConsentModePurposeStatusEnum
    var UNKNOWN = 0, GRANTED = 1, DENIED = 2, NOT_APPLICABLE = 3, NOT_CONFIGURED = 4;

    // The current TCF answer, or null if it isn't available
    function readTcData(callback) {
      if (typeof window.__tcfapi !== "function") return callback(null);
      var answered = false;
      window.__tcfapi("addEventListener", 2, function (tcData, success) {
        if (answered || (success && tcData && tcData.eventStatus === "cmpuishown")) return;
        answered = true;
        if (success && tcData) window.__tcfapi("removeEventListener", 2, function () {}, tcData.listenerId);
        callback(success ? tcData : null);
      });
    }

    // true or false, or null while the answer isn't known
    function allowed(item) {
      var vendor = item.vendor;
      if (item.analytics) {
        var values = answer.values;
        var analytics = values ? values.analyticsStoragePurposeConsentStatus : NOT_CONFIGURED;
        if (analytics === GRANTED || analytics === NOT_APPLICABLE) return true;
        if (analytics === DENIED) return false;
        if (analytics !== NOT_CONFIGURED) return null;
        vendor = 755;
      }
      var tcData = answer.tcData;
      if (!tcData) return null;
      if (tcData.gdprApplies === false) return true;
      return !!(tcData.purpose.consents[1] && tcData.vendor.consents[vendor]);
    }

    // Also removes cookies that earlier versions of the site set without asking
    function deleteAnalyticsCookies() {
      var site = location.hostname.split(".").slice(-2).join(".");
      document.cookie.split(";").forEach(function (cookie) {
        var name = cookie.split("=")[0].trim();
        if (name !== "_ga" && name.indexOf("_ga_") !== 0) return;
        ["", "; domain=" + location.hostname, "; domain=." + site].forEach(function (domain) {
          document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/" + domain;
        });
      });
    }

    function decide() {
      var withdrawn = false;
      for (var i = 0; i < queue.length; i++) {
        var item = queue[i];
        var ok = allowed(item);
        if (ok === true && !item.done) {
          item.done = true;
          item.run(answer.values);
        } else if (ok === false) {
          if (item.analytics) deleteAnalyticsCookies();
          if (item.done) withdrawn = true;
        }
      }
      // A script that already ran lost its consent: reload, so it's gone
      if (withdrawn) location.reload();
    }

    function followConsent() {
      var values = typeof googlefc.getGoogleConsentModeValues === "function" ? googlefc.getGoogleConsentModeValues() : null;
      readTcData(function (tcData) {
        answer = { values: values, tcData: tcData };
        decide();
      });
    }

    queue.push = function (item) {
      Array.prototype.push.call(queue, item);
      if (answer) decide();
      return queue.length;
    };
    // Runs once the answer is known: from an earlier visit, after visitors choose, or when the
    // message doesn't apply. CONSENT_DATA_READY runs again when visitors change their choice.
    window.googlefc.callbackQueue.push({ CONSENT_MODE_DATA_READY: followConsent });
    window.googlefc.callbackQueue.push({ CONSENT_DATA_READY: followConsent });
  })();
</script>
