<!-- start custom footer snippets -->
<div class="page__footer-copyright">
  <a href="{{ '/legal-notice/' | relative_url }}">Legal notice</a> &middot; <a href="{{ '/privacy/' | relative_url }}">Privacy</a> &middot; <a href="#cookie-settings">Cookie settings</a>
  <br>As an Amazon Associate I earn from qualifying purchases.
</div>
<script>
  // "Cookie settings" reopens the AdSense consent message, or explains why it can't
  document.addEventListener("click", function (event) {
    if (!event.target.closest('a[href="#cookie-settings"]')) return;
    event.preventDefault();
    window.googlefc = window.googlefc || {};
    window.googlefc.callbackQueue = window.googlefc.callbackQueue || [];
    var timer = null, opened = false;
    window.googlefc.callbackQueue.push(function () {
      // the tool is there (possibly late): drop the pending or shown note, then open the settings
      opened = true;
      clearTimeout(timer);
      var shown = document.getElementById("cookie-settings-note");
      if (shown) shown.remove();
      window.googlefc.showRevocationMessage();
    });
    // If Google's consent tool is blocked (ad blockers usually block it), the queue never runs: say so
    timer = setTimeout(function () {
      if (opened || document.getElementById("cookie-settings-note")) return;
      var note = document.createElement("div");
      note.id = "cookie-settings-note";
      note.setAttribute("role", "status");
      note.textContent = "Google's consent tool isn't available in this browser right now, probably because of an ad blocker or privacy extension, so the cookie settings can't be opened here. Any earlier choice stays as it was, and Google Analytics doesn't start on this page while the tool is blocked.";
      note.style.cssText = "position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:1000;box-sizing:border-box;" +
        "width:calc(100vw - 2rem);max-width:32rem;padding:.8em 1em;background:#333;color:#fff;border-radius:4px;" +
        "font-size:.8rem;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.3)";
      document.body.appendChild(note);
      setTimeout(function () { note.remove(); }, 12000);
    }, 2500);
  });
</script>

<style>
  .consent-embed { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em;
    max-width: 100%; aspect-ratio: 16 / 9; padding: 1em; box-sizing: border-box; text-align: center; font-size: .8em;
    background: #f5f5f5; border: 1px solid #ddd; }
  .consent-embed p { margin: 0; max-width: 32em; }
  .responsive-video-container .consent-embed { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<script>
  // Videos load only after a click: their iframes use data-consent-src instead of src, so nothing is requested
  // from YouTube or Vimeo until the visitor agrees.
  document.addEventListener("DOMContentLoaded", function () {
    var names = { "www.youtube-nocookie.com": "YouTube (Google)", "player.vimeo.com": "Vimeo (USA)" };
    document.querySelectorAll("iframe[data-consent-src]").forEach(function (frame) {
      var url = new URL(frame.getAttribute("data-consent-src"), location.href);
      var name = names[url.hostname] || url.hostname;
      var box = document.createElement("div");
      box.className = "consent-embed";
      var width = frame.getAttribute("width");
      if (width) box.style.width = /%$/.test(width) ? width : width + "px";
      var note = document.createElement("p");
      note.textContent = "This video is hosted by " + name + ". Loading it sends your IP address to " + name + ", which may store cookies.";
      var button = document.createElement("button");
      button.type = "button";
      button.className = "btn btn--primary";
      button.textContent = "Load video";
      button.addEventListener("click", function () {
        frame.src = url.href;
        frame.hidden = false;
        box.remove();
        // The theme runs FitVids on page load, when these iframes had no src yet; size them now.
        // Videos from the theme's video include already sit in a responsive container.
        if (!frame.closest(".responsive-video-container") && window.jQuery && jQuery.fn.fitVids) {
          if (/%$/.test(frame.getAttribute("width") || "")) { frame.setAttribute("width", "560"); frame.setAttribute("height", "315"); }
          jQuery(frame.parentNode).fitVids();
        }
      });
      box.append(note, button);
      frame.hidden = true;
      frame.parentNode.insertBefore(box, frame);
    });
  });
</script>
