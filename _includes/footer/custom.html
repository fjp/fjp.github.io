<!-- start custom footer snippets -->
<div class="page__footer-copyright">
  <a href="{{ '/privacy/' | relative_url }}">Privacy</a> &middot; <a href="#cookie-settings">Cookie settings</a>
</div>
<script>
  // "Cookie settings" reopens the AdSense consent message
  document.addEventListener("click", function (event) {
    if (!event.target.closest('a[href="#cookie-settings"]')) return;
    event.preventDefault();
    window.googlefc = window.googlefc || {};
    window.googlefc.callbackQueue = window.googlefc.callbackQueue || [];
    window.googlefc.callbackQueue.push(function () { window.googlefc.showRevocationMessage(); });
  });
</script>

<!-- Awin publisher MasterTag, after consent to storage on the device (see afterConsent in head/custom.html) -->
<script>
  (window.afterConsent = window.afterConsent || []).push({
    run: function () {
      var script = document.createElement("script");
      script.src = "https://www.dwin2.com/pub.642237.min.js";
      document.body.appendChild(script);
    }
  });
</script>
<!-- end custom footer snippets -->
