# Builds the site from master and publishes it to the gh-pages branch,
# which GitHub Pages serves. PR previews live in gh-pages/pr-preview/
# (see preview.yml) and are kept on every deployment.
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # The repository variable RUNNER picks the runner: "local" runs the job on
    # the self-hosted runner with that label, no variable means GitHub's runners
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1
        if: runner.environment == 'github-hosted'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The self-hosted runner brings its own Ruby and keeps the gems between runs
      - name: Install gems
        if: runner.environment == 'self-hosted'
        env:
          BUNDLE_FROZEN: "true"
        run: |
          export BUNDLE_PATH="$RUNNER_TOOL_CACHE/bundle"
          bundle install --jobs 4
          # The build step needs the same gems
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: Build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          bundle exec jekyll build
          # The site is already built, GitHub Pages must not run Jekyll again
          touch _site/.nojekyll

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
