# Builds every pull request and publishes it to
# https://fjp.at/pr-preview/pr-<number>/ on the gh-pages branch.
# A successful preview is recorded as a deployment to the "pr-preview"
# environment, which the master branch protection requires before merging.
# The preview is removed when the pull request is closed.
name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  PREVIEW_PATH: pr-preview/pr-${{ github.event.number }}
  HEAD_REF: ${{ github.head_ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  preview:
    # Pull requests from forks get a read-only token and cannot publish
    if: github.event.pull_request.head.repo.full_name == github.repository
    # The repository variable RUNNER picks the runner: "local" runs the job on
    # the self-hosted runner with that label, no variable means GitHub's runners
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1
        if: runner.environment == 'github-hosted' && github.event.action != 'closed'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The self-hosted runner brings its own Ruby and keeps the gems between runs
      - name: Install gems
        if: runner.environment == 'self-hosted' && github.event.action != 'closed'
        env:
          BUNDLE_FROZEN: "true"
        run: |
          export BUNDLE_PATH="$RUNNER_TOOL_CACHE/bundle"
          bundle install --jobs 4
          # The build step needs the same gems
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: Build
        if: github.event.action != 'closed'
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: |
          bundle exec jekyll build --baseurl "/$PREVIEW_PATH"
          # Pages link to each other with root-relative URLs such as /projects/fpv/,
          # point them into the preview so that it can be browsed on its own
          find _site -name '*.html' -print0 | xargs -0 perl -pi -e \
            's{\b((?:href|src)=["\x27])/(?!/|\Q$ENV{PREVIEW_PATH}\E/)}{$1/$ENV{PREVIEW_PATH}/}g'
          # Lets the deployment step check that this exact commit is live
          echo "$HEAD_SHA" > _site/preview-sha.txt
          # A preview needs no CNAME, and the publish action never deletes one,
          # so it would stay behind when the preview is removed
          rm -f _site/CNAME

      - name: Publish preview
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: fjp.at
          # Waiting for the Pages build of the exact preview commit fails when
          # another push to gh-pages supersedes that build, see Record deployment
          wait-for-pages-deployment: false
          qr-code: false

      - name: Record deployment
        if: steps.preview.outputs.deployment-action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          # Any later Pages build also contains this preview, so wait until
          # the preview serves this commit instead of waiting for one build
          live=""
          for i in $(seq 1 60); do
            served=$(curl -fsS "https://fjp.at/$PREVIEW_PATH/preview-sha.txt?run=$GITHUB_RUN_ID-$i" || true)
            if [ "$served" = "$HEAD_SHA" ]; then live=1; break; fi
            sleep 15
          done
          if [ -z "$live" ]; then
            echo "::error::Preview for $HEAD_SHA did not go live within 15 minutes"
            exit 1
          fi

          id=$(jq -n --arg ref "$HEAD_REF" '{
              ref: $ref,
              environment: "pr-preview",
              description: "PR preview",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)
          if [ "$sha" != "$HEAD_SHA" ]; then
            # The branch moved while building, the run for the new commit records it
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive --silent
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success -f environment_url="$PREVIEW_URL" --silent

      - name: Deactivate deployments
        if: steps.preview.outputs.deployment-action == 'remove'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/deployments" \
            -f environment=pr-preview -f ref="$HEAD_REF" --jq '.[].id' |
          while read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive --silent
          done
